<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Question for Suchita ❤️</title>
    <style>
        /* General Styling */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #fff5f7 0%, #ffe4e8 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        #container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(214, 51, 132, 0.1);
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        h1 {
            color: #d63384;
            font-size: 24px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Buttons */
        .btn-wrap {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            height: 50px; /* Space for buttons to exist */
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #ff758f;
        }

        #noBtn {
            background-color: #f8f9fa;
            color: #6c757d;
            border: 1px solid #dee2e6;
            position: absolute; /* Needed for jumping effect */
        }

        /* Success Message Styling */
        #success-message {
            display: none;
        }

        .heart {
            color: #ff4d6d;
            font-size: 50px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="container">
        <!-- Step 1: The Question -->
        <div id="ask-section">
            <div class="heart">❤️</div>
            <h1>Will you go on a date with me Suchita?</h1>
            <div class="btn-wrap">
                <button id="yesBtn" onclick="showSuccess()">YES!</button>
                <button id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">NO</button>
            </div>
        </div>

        <!-- Step 2: The Success Reveal -->
        <div id="success-message">
            <div class="heart">🎉</div>
            <h1 style="color: #2b2d42;">Yay! I'm so happy! ❤️</h1>
            <p>I'll text you the details now, Suchita. I can't wait!</p>
            <p style="font-size: 14px; color: #888; margin-top: 20px;">(P.S. You made my day!)</p>
        </div>
    </div>

    <script>
        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            const container = document.getElementById('container');
            
            // Calculate random positions within the container
            // We keep it within the container so it doesn't fly off-screen
            const maxX = container.clientWidth - noBtn.offsetWidth - 20;
            const maxY = container.clientHeight - noBtn.offsetHeight - 20;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function showSuccess() {
            document.getElementById('ask-section').style.display = 'none';
            document.getElementById('success-message').style.display = 'block';
            
            // Add a little confetti effect (optional)
            confetti();
        }

        // A tiny simple confetti effect
        function confetti() {
            for(let i=0; i<50; i++) {
                const petal = document.createElement('div');
                petal.style.position = 'fixed';
                petal.style.width = '10px';
                petal.style.height = '10px';
                petal.style.backgroundColor = ['#ff4d6d', '#ff758f', '#ffb3c1'][Math.floor(Math.random() * 3)];
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.top = '-10px';
                petal.style.borderRadius = '50%';
                petal.style.zIndex = '1000';
                document.body.appendChild(petal);

                const animation = petal.animate([
                    { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                    { transform: `translateY(100vh) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                ], {
                    duration: 2000 + Math.random() * 3000,
                    easing: 'linear'
                });

                animation.onfinish = () => petal.remove();
            }
        }
    </script>
</body>
</html>
